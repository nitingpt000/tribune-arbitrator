services:
  postgres:
    image: postgres:16-alpine
    container_name: tribune-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tribune
      POSTGRES_USER: tribune
      POSTGRES_PASSWORD: tribune
    ports:
      - '5432:5432'
    volumes:
      - tribune-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tribune -d tribune']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tribune-postgres-data:
